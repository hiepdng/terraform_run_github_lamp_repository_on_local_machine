name: Deploy LAMP Project Locally

on:
  #push:
  #  branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  deploy-local:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          
      - name: Log in to Docker Hardened Images Registry (dhi.io)
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Terraform Init
        run: terraform init

      # Output the plan to a binary file named 'tfplan'
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # Upload the binary plan file as a workflow artifact
      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-file
          path: tfplan
          #retention-days: 1  # Short retention for security
          
      - name: Terraform Apply
        #if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan




