name: Clean up lamp to Local Machine

on:
  #push:
  #  branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Load .env file variables
        run: |
          if [ -f .env ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              # Skip comments and empty lines
              [[ "$line" =~ ^#.*$ ]] || [ -z "$line" ] && continue
              echo "$line" >> $GITHUB_ENV
            done < .env
          else
            echo ".env file not found"
          fi

      - name: Terraform destroy
        run: |
          terraform destroy -auto-approve
          #terraform destroy -target=docker_image."${PROJECT_NAME}-${HTTPDVERSION}"
          #terraform destroy -target=docker_image."${PROJECT_NAME}-${MYSQLVERSION}"
          #terraform destroy -target=docker_image."${PROJECT_NAME}-${PHPVERSION}"
