name: Clean up lamp to Local Machine

on:
  #push:
  #  branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
          
      - name: Terraform destroy
        #run: terraform destroy -auto-approve
        run: |
          # Remove contrainers
          docker rm -f lamp-httpd lamp-mysql lamp-php-fpm  || true
          # Remove images
          docker rmi $(docker images --filter "reference=lamp-*" -q)
          # Remove docker network
          docker network ls --filter name=lamp_network -q |xargs -r docker network rm
   
